<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KoneqtME Events Module — Prototype</title>
<style>
:root{--or:#F26B1D;--or2:#FF8A3D;--teal:#12B5A6;--teal2:#0E9488;--navy:#12263F;--mut:#5B6B80;--bd:#DCE6EF;--card:#fff;--bg:#EAF6FB;--ok:#12855F;--warn:#B7791F;--bad:#C0392B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--navy);background:linear-gradient(180deg,#F4FBFE,#DDF1F8);min-height:100vh;font-size:14px}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--teal);outline-offset:1px}
header{background:linear-gradient(90deg,var(--or),var(--or2));color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:9;padding:10px 18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;letter-spacing:-.5px;display:flex;align-items:center;gap:8px}.logo i{font-style:normal;background:#fff;color:var(--teal2);width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:15px}.logo b{color:#0E9488;background:#fff;padding:0 6px;border-radius:6px;margin-right:-4px}.logo span{color:#fff}
.actors{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.actors button{background:rgba(255,255,255,.18);border:0;color:#fff;padding:8px 14px;border-radius:99px;font-weight:600}
.actors button.on{background:#fff;color:var(--or)}
.life{display:flex;gap:4px;overflow-x:auto;padding:10px 18px;background:#fff;border-bottom:1px solid var(--bd);font-size:12px;color:var(--mut);scrollbar-width:none}
.life span{white-space:nowrap;display:flex;align-items:center;gap:5px;padding-right:10px}.life em{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:700;color:var(--teal2)}.life span.on{color:var(--navy);font-weight:700}.life span.on em{background:var(--teal);color:#fff}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 110px)}
aside{background:var(--navy);color:#fff;padding:16px 12px;display:flex;flex-direction:column;gap:4px}
aside button{background:0;border:0;color:#B8C7D9;text-align:left;padding:10px 12px;border-radius:10px;font-weight:600}
aside button.on{background:rgba(18,181,166,.2);color:#fff}
aside .role{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#7E93AC;margin:6px 12px}
aside .prof{margin-top:auto;padding:12px;font-size:12px;color:#B8C7D9;border-top:1px solid rgba(255,255,255,.12)}
main{padding:22px;max-width:1180px;width:100%}
h1{font-size:24px;margin:0 0 4px}h2{font-size:17px;margin:0 0 10px}p.s{color:var(--mut);margin:0 0 16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.sp{margin-left:auto}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(18,38,63,.05)}
.cover{height:130px;border-radius:10px;margin:-4px -4px 12px;display:flex;align-items:flex-end;padding:10px;color:#fff;font-weight:700}
.g1,.g2,.g3{background-blend-mode:normal}.g1{background:radial-gradient(circle at 18% 30%,rgba(255,255,255,.4),transparent 28%),radial-gradient(circle at 82% 15%,rgba(255,210,120,.55),transparent 26%),linear-gradient(180deg,transparent 45%,rgba(0,0,0,.55)),linear-gradient(135deg,#F26B1D,#7A2E8E 60%,#12263F)}.g2{background:radial-gradient(circle at 75% 25%,rgba(120,255,240,.5),transparent 28%),radial-gradient(circle at 20% 60%,rgba(255,255,255,.25),transparent 25%),linear-gradient(180deg,transparent 45%,rgba(0,0,0,.55)),linear-gradient(135deg,#12B5A6,#1B4F9C 70%,#12263F)}.g3{background:radial-gradient(circle at 70% 20%,rgba(255,230,140,.7),transparent 24%),linear-gradient(180deg,transparent 45%,rgba(0,0,0,.5)),linear-gradient(135deg,#FF8A3D,#C0392B 60%,#3B1B4F)}
.btn{background:var(--teal);color:#fff;border:0;padding:10px 18px;border-radius:10px;font-weight:700}.btn:hover{background:var(--teal2)}
.btn.or{background:var(--or)}.btn.gh{background:#fff;color:var(--navy);border:1px solid var(--bd)}.btn[disabled]{opacity:.45;cursor:not-allowed}.btn.sm{padding:6px 12px;font-size:12px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;background:#E3F6F3;color:var(--ok)}
.pill.d{background:#EEF1F5;color:var(--mut)}.pill.w{background:#FFF3DC;color:var(--warn)}.pill.c{background:#E1EEFB;color:#1B4F9C}.pill.x{background:#FBE4E1;color:var(--bad)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.chips button{border:1px solid var(--bd);background:#fff;padding:7px 14px;border-radius:99px;color:var(--navy);font-weight:600}.chips button.on{background:linear-gradient(90deg,var(--teal),var(--or));color:#fff;border-color:transparent}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:#fff;color:var(--navy)}
label{display:block;font-weight:600;font-size:12px;margin:12px 0 5px}label small{color:var(--mut);font-weight:400}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.steps{display:flex;gap:6px;margin-bottom:18px;overflow-x:auto}.steps div{flex:1;min-width:90px;font-size:11px;color:var(--mut);border-top:4px solid var(--bd);padding-top:6px}.steps .done{border-color:var(--teal);color:var(--navy)}.steps .cur{border-color:var(--or);color:var(--navy);font-weight:700}
.map{height:190px;border-radius:12px;background:linear-gradient(#cfeaf0,#e4f3f0);position:relative;overflow:hidden;border:1px solid var(--bd)}
.map:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(35deg,transparent 0 38px,rgba(255,255,255,.8) 38px 42px),repeating-linear-gradient(-55deg,transparent 0 60px,rgba(255,255,255,.7) 60px 63px)}
.pin{position:absolute;left:52%;top:38%;width:26px;height:26px;background:var(--or);border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 4px 8px rgba(0,0,0,.25)}
.kpi{font-size:22px;font-weight:800}.kpi small{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin:14px 0;overflow-x:auto}.tabs button{background:0;border:0;padding:10px 14px;color:var(--mut);font-weight:600;border-bottom:3px solid transparent}.tabs button.on{color:var(--navy);border-color:var(--teal)}
.hero{background:linear-gradient(120deg,var(--navy),#1B4F9C);color:#fff;border-radius:14px;padding:18px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--mut);font-size:11px;text-transform:uppercase;padding:8px}td{padding:10px 8px;border-top:1px solid var(--bd)}.tw{overflow-x:auto}
.note{background:#FFF8E6;border:1px solid #F1D48A;color:#7A5A12;border-radius:10px;padding:8px 12px;font-size:12px;margin-bottom:14px}
.pay{display:flex;gap:10px}.pay button{flex:1;padding:12px;border:2px solid var(--bd);background:#fff;border-radius:12px;font-weight:700;color:var(--navy)}.pay button.on{border-color:var(--teal);background:#E9F9F7}
.qr{width:120px;height:120px;background:repeating-conic-gradient(var(--navy) 0 25%,#fff 0 50%) 0 0/16px 16px;border:6px solid #fff;outline:1px solid var(--bd)}
.ticket{max-width:380px;margin:auto;background:#fff;border-radius:18px;overflow:hidden;border:1px solid var(--bd)}
.ticket .top{background:linear-gradient(135deg,#F26B1D,#7A2E8E);color:#fff;padding:18px}
.ticket .bd{padding:18px;text-align:center}
.doc h2{margin-top:22px}.doc code,.doc pre{background:#F1F6FA;border-radius:6px;padding:2px 6px;font-size:12px}.doc pre{padding:12px;overflow:auto}.doc li{margin:4px 0}
.buyer{max-width:760px;margin:auto}
@media(max-width:800px){.shell{grid-template-columns:1fr}aside{flex-direction:row;overflow-x:auto;padding:8px}aside .role,aside .prof{display:none}aside button{white-space:nowrap}.two{grid-template-columns:1fr}main{padding:14px}}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script></head><body>
<header><div class="logo"><b>Koneqt</b><span>ME</span></div><nav class="actors" id="actors" aria-label="Actor"></nav></header>
<div class="life" id="life" aria-label="Event lifecycle"></div>
<div class="shell" id="shell"><aside id="side"></aside><main id="app"></main></div>
<script>
// PROTOTYPE: all data below is mock. No backend, email, Stripe or M-Pesa is connected.
const EV=[{n:'Afro Fusion Night',d:'12 Oct 2026 · 7:00 PM',c:'Nairobi',v:'The Nairobi Arena',s:4620,cap:6000,r:4820000,st:'Published',o:'Frank Kober',g:'g1',p:1000},
{n:'Nairobi Tech Summit',d:'20 Nov 2026 · 9:00 AM',c:'Nairobi',v:'KICC',s:1240,cap:2000,r:2460000,st:'Draft',o:'Alex Mwangi',g:'g2',p:1500},
{n:'Summer Vibes',d:'5 Dec 2026 · 6:00 PM',c:'Mombasa',v:'Nyali Beach',s:980,cap:1500,r:1560000,st:'Completed',o:'Grace Njeri',g:'g3',p:1200}];
const ORD=[['#KQ2392','James Mwangi','2 × Regular',2000,'Paid'],['#KQ2391','Amina Wanjiku','1 × VIP',3000,'Paid'],['#KQ2390','Brian Otieno','4 × Regular',4000,'Paid'],['#KQ2389','Grace Njeri','2 × VVIP',10000,'Pending'],['#KQ2388','David Kimani','1 × Regular',1000,'Refunded']];
const LIFE=['Create Event','Publish Event','Share Event','Sell Tickets','Manage Orders','Track Sales','Manage Promoters','Check-in Attendees'];
let CH=[],CI=[],cid=0;const D7=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];const S={a:'org',cur:'KES',v:'home',tab:'Overview',w:1,ev:0,fil:'All',b:'browse',c:1,pay:'card',mail:'',sent:false,ok:false,qty:{Regular:1,VIP:0},done:{}};
const ACT={org:'Event Organizer',pro:'Promoter',adm:'System Owner',buy:'Buyer',doc:'Module Docs'};
const NAV={org:[['home','Events'],['wizard','+ Create Event'],['mine','My Events'],['help','Help']],pro:[['home','Dashboard'],['links','Link Analytics'],['sales','Buyers & Payments'],['earn','Commissions']],adm:[['home','All Events'],['orgs','Organizers'],['pros','Promoters'],['ana','Platform Analytics'],['rep','Reports']],buy:[['browse','Browse Events'],['tickets','My Tickets']],doc:[['module','How it works']]};
const KES=n=>{try{return new Intl.NumberFormat('en',{style:'currency',currency:S.cur,maximumFractionDigits:0}).format(n)}catch(e){return S.cur+' '+n}};
const CUR=(()=>{try{const d=new Intl.DisplayNames(['en'],{type:'currency'});return Intl.supportedValuesOf('currency').map(c=>[c,d.of(c)])}catch(e){return[['KES','Kenyan Shilling'],['USD','US Dollar'],['EUR','Euro'],['TZS','Tanzanian Shilling'],['GBP','British Pound']]}})();
const curSel=()=>`<label>Event currency *<select onchange="S.cur=this.value;render()">${CUR.map(([c,n])=>`<option value="${c}" ${c==S.cur?'selected':''}>${c} · ${n}</option>`).join('')}</select></label>`;
const tb=(h,r)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(y=>`<td>${y}</td>`).join('')}</tr>`).join('')}</table></div>`;
const PAL=['#12B5A6','#F26B1D','#12263F','#8FD6E8','#F5B27A'];
const VISA='<svg viewBox="0 0 64 40" width="44" height="28" role="img" aria-label="Visa"><rect width="64" height="40" rx="6" fill="#1A1F71"/><text x="32" y="27" font-family="Arial" font-weight="900" font-style="italic" font-size="19" fill="#fff" text-anchor="middle">VISA</text></svg>';
const MC='<svg viewBox="0 0 64 40" width="44" height="28" role="img" aria-label="Mastercard"><rect width="64" height="40" rx="6" fill="#fff" stroke="#DCE6EF"/><circle cx="25" cy="20" r="12" fill="#EB001B"/><circle cx="39" cy="20" r="12" fill="#F79E1B"/><path d="M32 10.5a12 12 0 0 1 0 19a12 12 0 0 1 0-19z" fill="#FF5F00"/></svg>';
const AMEX='<svg viewBox="0 0 64 40" width="44" height="28" role="img" aria-label="American Express"><rect width="64" height="40" rx="6" fill="#2E77BC"/><text x="32" y="25" font-family="Arial" font-weight="800" font-size="12" fill="#fff" text-anchor="middle">AMEX</text></svg>';
const MPESA='<svg viewBox="0 0 84 28" width="70" height="26" role="img" aria-label="M-Pesa"><rect width="84" height="28" rx="6" fill="#43B02A"/><text x="42" y="19" font-family="Arial" font-weight="800" font-size="13" fill="#fff" text-anchor="middle">M-PESA</text></svg>';
function cardForm(){return `<div style="margin-top:14px"><div class="row" id="lv" style="gap:6px">${VISA}${MC}${AMEX}</div><label>Card number<input inputmode="numeric" autocomplete="cc-number" placeholder="4242 4242 4242 4242" maxlength="19" oninput="fmtCard(this)"></label><div class="two"><label>Expiry<input placeholder="MM / YY"></label><label>CVC<input placeholder="123" maxlength="4"></label></div><label>Name on card<input placeholder="John Mwangi"></label><p class="s" style="font-size:12px;margin-top:8px">🔒 Card details are handled by Stripe. Prototype only: nothing is charged.</p></div>`}
function fmtCard(el){const v=el.value.replace(/\D/g,'').slice(0,16);el.value=v.replace(/(.{4})/g,'$1 ').trim();const b=v[0]=='4'?0:v[0]=='5'?1:v[0]=='3'?2:-1;[...document.getElementById('lv').children].forEach((n,i)=>n.style.opacity=b<0||b==i?1:.25)}
function lc(l,sets){const id='c'+cid++;CH.push({id,type:'line',data:{labels:l,datasets:sets.map(x=>({label:x.label,data:x.data,borderColor:x.color,backgroundColor:x.color+'22',fill:true,tension:.4,pointRadius:2}))}});return `<div style="height:220px"><canvas id="${id}"></canvas></div>`}
function dn(l,v){const id='c'+cid++;CH.push({id,type:'doughnut',data:{labels:l,datasets:[{data:v,backgroundColor:PAL,borderWidth:2}]},opt:{cutout:'65%'}});return `<div style="height:220px"><canvas id="${id}"></canvas></div>`}
function bc(l,v,n){const id='c'+cid++;CH.push({id,type:'bar',data:{labels:l,datasets:[{label:n,data:v,backgroundColor:'#12B5A6',borderRadius:6}]}});return `<div style="height:220px"><canvas id="${id}"></canvas></div>`}
function chart(p){return lc(D7,[{label:'Tickets sold',data:p,color:'#12B5A6'}])}
function bars(v,l){return dn(l||['Regular','VIP','VVIP'],v)}
function drawCharts(){if(!window.Chart)return;CI=CH.splice(0).map(c=>new Chart(document.getElementById(c.id),{type:c.type,data:c.data,options:Object.assign({responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',display:c.type!='bar'}}},c.opt||{})}))}
const PB=[['James Mwangi','j***@gmail.com','2 × Regular',2000,'M-Pesa','QGH7K2LM9P','Paid','28 Sep 10:24'],['Amina Wanjiku','a***@yahoo.com','1 × VIP',3000,'Visa •••• 4242','pi_3Q8xAf2e','Paid','28 Sep 09:12'],['Brian Otieno','b***@gmail.com','4 × Regular',4000,'Mastercard •••• 5100','pi_3Q8wZk1d','Paid','27 Sep 18:47'],['Grace Njeri','g***@mail.com','2 × VVIP',10000,'M-Pesa','QGG4T8NX2A','Pending','27 Sep 15:03'],['David Kimani','d***@outlook.com','1 × Regular',1000,'Visa •••• 1881','pi_3Q8uPq9c','Refunded','26 Sep 11:30']];
const P=(t,c='')=>`<span class="pill ${c}">${t}</span>`;
const stc=s=>({Published:'',Draft:'d',Completed:'c',Cancelled:'x',Paid:'',Pending:'w',Refunded:'x'}[s]||'d');
function go(a,v){S.a=a;if(v)S.v=v;S.tab='Overview';render();scrollTo(0,0)}
function set(k,v){S[k]=v;render()}
function render(){
 CI.forEach(c=>c.destroy());CI=[];CH=[];
 document.getElementById('actors').innerHTML=Object.entries(ACT).map(([k,n])=>`<button class="${S.a==k?'on':''}" onclick="go('${k}',{org:'home',pro:'home',adm:'home',buy:'browse',doc:'module'}['${k}'])">${n}</button>`).join('');
 const lf={org:S.v=='wizard'?0:S.tab=='Orders'?4:S.tab=='Analytics'?5:S.tab=='Promoters'?6:S.tab=='Check-in'?7:2,pro:2,adm:5,buy:3,doc:-1}[S.a];
 document.getElementById('life').innerHTML=LIFE.map((l,i)=>`<span class="${i==lf?'on':''}"><em>${i+1}</em>${l}</span>`).join('');
 const nv=NAV[S.a],cur=S.a=='buy'?S.b:S.v;
 document.getElementById('side').innerHTML=`<div class="role">${ACT[S.a]}</div>`+nv.map(([k,n])=>`<button class="${cur==k?'on':''}" onclick="${S.a=='buy'?`set('b','${k}')`:`set('v','${k}');S.tab='Overview';render()`}">${n}</button>`).join('')+`<div class="prof">${{org:'Frankline kober',pro:'Alex Mwangi',adm:'KoneqtME Admin',buy:'Guest checkout',doc:'v1 · Phase 1'}[S.a]}</div>`;
 document.getElementById('app').innerHTML=({org:org,pro:pro,adm:adm,buy:buy,doc:doc})[S.a]();
 drawCharts();
}
/* ---------- ORGANIZER ---------- */
function cards(list,act){return `<div class="grid">${list.map((e,i)=>`<div class="card"><div class="cover ${e.g}">${e.n}</div><div class="row"><b>${e.n}</b><span class="sp">${P(e.st,stc(e.st))}</span></div><div style="color:var(--mut);font-size:12px;margin:6px 0">${e.d} · ${e.c}</div><div style="font-size:12px">${e.s.toLocaleString()} / ${e.cap.toLocaleString()} tickets sold</div><div style="height:6px;background:var(--bg);border-radius:9px;margin:6px 0"><div style="height:6px;border-radius:9px;background:var(--teal);width:${e.s/e.cap*100}%"></div></div><b>${KES(e.r)}</b><div class="row" style="margin-top:10px"><button class="btn sm" onclick="${act(i)}">${S.a=='pro'?'Promote':'Manage Event'}</button></div></div>`).join('')}</div>`}
function org(){
 if(S.v=='wizard')return wizard();
 if(S.v=='help')return `<h1>Help</h1><p class="s">Follow the 7-step wizard to create an event. Drafts are saved at any step.</p>`;
 if(S.v=='control')return control();
 const f=['All','Draft','Published','Completed','Cancelled'];
 const l=EV.filter(e=>S.fil=='All'||e.st==S.fil);
 return `<div class="row"><div><h1>${S.v=='mine'?'My Events':'Events'}</h1><p class="s">Events you own or are authorized to manage.</p></div><button class="btn or sp" onclick="S.w=1;set('v','wizard')">+ Create Event</button></div>
 <div class="chips">${f.map(x=>`<button class="${S.fil==x?'on':''}" onclick="set('fil','${x}')">${x}</button>`).join('')}</div>
 ${l.length?cards(l,i=>`S.ev=${EV.indexOf(l[i])};S.v='control';render()`):'<div class="card">No events yet. Create your first event.</div>'}`}
const WS=['Basic Info','Date & Venue','Tickets','Promoters','Policies','Review','Publish'];
function wizard(){
 const w=S.w;let b='';
 if(w==1)b=`<label>Event Name *<input value="Afro Fusion Night"></label><div class="two"><label>Category *<select><option>Music</option><option>Tech</option><option>Business</option></select></label><label>Cover Image<input type="file" accept="image/*"></label></div><label>Short Description * <small>max 100 chars</small><input maxlength="100" value="A night of Afro beats, good vibes and great people."></label><label>Full Description *<textarea rows="4">Get ready for the ultimate Afro fusion experience with top DJs, food and drinks.</textarea></label><label>Event Gallery<input type="file" multiple accept="image/*"></label>`;
 if(w==2)b=`<div class="two"><div><div class="two"><label>Start Date *<input type="date" value="2026-10-12"></label><label>Start Time *<input type="time" value="19:00"></label><label>End Date *<input type="date" value="2026-10-12"></label><label>End Time *<input type="time" value="23:00"></label></div><label>Timezone *<select><option>Africa/Nairobi (EAT)</option></select></label><label>Venue Name *<input value="The Nairobi Arena"></label><label>Address *<input value="Kenyatta Avenue"></label><label>City *<input value="Nairobi"></label></div><div><label>Map Location <small>search or drop a pin</small><input placeholder="Search a place on the map"></label><div class="map" aria-label="Map preview"><div class="pin"></div></div><p class="s" style="font-size:12px;margin-top:8px">Prototype map: production uses a maps provider so buyers get directions.</p></div></div>`;
 if(w==3)b=`${curSel()}<div class="tw"><table><tr><th>Ticket</th><th>Price (${S.cur})</th><th>Capacity</th><th>Sales start</th><th>Sales end</th><th>Min</th><th>Max</th></tr>${[['Regular',1000,2000],['VIP',3000,1000],['VVIP',5000,500]].map(t=>`<tr><td><input value="${t[0]}"></td><td><input type="number" value="${t[1]}"></td><td><input type="number" value="${t[2]}"></td><td><input type="date"></td><td><input type="date"></td><td><input type="number" value="1"></td><td><input type="number" value="10"></td></tr>`).join('')}</table></div><button class="btn gh sm" style="margin-top:10px">+ Add Ticket Type</button>`;
 if(w==4)b=`<div class="two"><label>Promoter email<input placeholder="promoter@email.com"></label><label>Commission (%)<input type="number" value="10"></label><label>Promo code<input value="AFRO10"></label><label>Promotional link<input readonly value="konequt.me/afro-fusion-night?ref=alex"></label></div><button class="btn gh sm" style="margin-top:10px">+ Add Promoter</button>`;
 if(w==5)b=`<div class="two"><label>Refund Policy<select><option>No refunds</option><option>Up to 48h before</option></select></label><label>Ticket Transfer<select><option>Not allowed</option><option>Allowed</option></select></label><label>Age Restriction<select><option>All ages</option><option>18+</option></select></label><label>Instructions<input placeholder="e.g. Bring your ID"></label></div><label>Terms & Conditions<textarea rows="4"></textarea></label>`;

 if(S.tab=='Analytics')b=`<div class="chips"><button class="on">7 Days</button><button>Today</button><button>30 Days</button><button>Custom</button></div><div class="two"><div class="card"><h2>Sales over time</h2>${chart([20,35,30,55,48,80,95])}</div><div class="card"><h2>Ticket type performance</h2>${bars([60,26,14])}</div></div>`;

function buy(){
 const e=EV[0],tot=S.qty.Regular*1000+S.qty.VIP*3000,fee=Math.round(tot*.03);
 if(S.b=='browse')return `<div class="buyer"><div class="hero"><h1>Discover Amazing Events</h1><input placeholder="Search events, locations or categories" style="max-width:480px"></div>${cards(EV.filter(x=>x.st!='Draft'),i=>`set('b','detail')`).replace(/Manage Event/g,'Buy Tickets')}</div>`;
 if(S.b=='detail')return `<div class="buyer"><div class="card"><div class="cover ${e.g}" style="height:170px">${e.n}</div><h1>${e.n}</h1><p class="s">${e.d} · ${e.v}, ${e.c}</p><div class="map" style="height:120px"><div class="pin"></div></div><p>A night of Afro beats, good vibes and great people. Organizer: ${e.o}. Refunds: up to 48h before.</p><h2>Select tickets</h2>${['Regular','VIP'].map(t=>`<div class="row" style="padding:10px 0;border-top:1px solid var(--bd)"><b>${t}</b><span>${KES(t=='VIP'?3000:1000)}</span><span class="sp"><button class="btn gh sm" onclick="S.qty['${t}']=Math.max(0,S.qty['${t}']-1);render()" aria-label="Fewer ${t}">−</button> <b>${S.qty[t]}</b> <button class="btn gh sm" onclick="S.qty['${t}']++;render()" aria-label="More ${t}">+</button></span></div>`).join('')}<div class="row"><b>Total ${KES(tot)}</b><button class="btn sp" ${tot?'':'disabled'} onclick="S.c=1;S.sent=false;S.ok=false;set('b','checkout')">Buy Tickets</button><button class="btn gh">Share</button></div></div></div>`;
 if(S.b=='checkout'){const c=S.c;let b='';
  if(c==1)b=`<label>Full name *<input value="John Mwangi"></label><div class="two"><label>Email *<input type="email" id="em" value="${S.mail}" placeholder="you@email.com"></label><label>Phone *<input value="+254 712 345678"></label></div><p class="s" style="font-size:12px;margin-top:8px">No account needed. Your ticket is sent to this email.</p>`;
  if(c==2)b=`<div class="note">Prototype: no email is actually sent. Any 6 digits work.</div><p>We sent a 6-digit code to <b>${S.mail||'your email'}</b>.</p><label>Verification code<input id="code" maxlength="6" inputmode="numeric" placeholder="123456" oninput="S.ok=this.value.length==6;document.getElementById('nx').disabled=!S.ok"></label><button class="btn gh sm" style="margin-top:8px">Resend code</button>`;
  if(c==3)b=`<div class="pay"><button class="${S.pay=='card'?'on':''}" onclick="set('pay','card')"><div class="row" style="justify-content:center;gap:4px">${VISA}${MC}</div>Card</button><button class="${S.pay=='mpesa'?'on':''}" onclick="set('pay','mpesa')"><div class="row" style="justify-content:center">${MPESA}</div>M-Pesa</button></div>${S.pay=='card'?`${cardForm()}`:`<label>M-Pesa number<input value="+254 712 345678"></label><p class="s" style="font-size:12px">You'll get an STK push to approve on your phone.</p>`}<div class="card" style="margin-top:12px;background:var(--bg)">Tickets ${KES(tot)}<br>Service fee ${KES(fee)}<br><b>Total ${KES(tot+fee)}</b></div><div class="note" style="margin-top:12px">Payment is only marked successful when confirmed by the payment provider webhook. Here it is simulated.</div>`;
  return `<div class="buyer"><h1>Checkout</h1><div class="steps">${['Your details','Confirm email','Pay'].map((x,i)=>`<div class="${i+1<c?'done':i+1==c?'cur':''}">${i+1}. ${x}</div>`).join('')}</div><div class="card">${b}</div><div class="row" style="margin-top:14px"><button class="btn gh" onclick="c==1?set('b','detail'):set('c',${c-1})">← Back</button><button class="btn sp" id="nx" ${c==2&&!S.ok?'disabled':''} onclick="${c==1?`S.mail=document.getElementById('em').value.trim();if(!/^\\S+@\\S+\\.\\S+$/.test(S.mail)){alert('Enter a valid email');return}S.ok=false;set('c',2)`:c==2?`set('c',3)`:`set('b','success')`}">${c==3?'Pay '+KES(tot+fee):'Continue →'}</button></div></div>`}

/* ---------- DOCS ---------- */
function doc(){return `<div class="card doc"><h1>How the Events Module works</h1><p class="s">Everything revolves around the event.</p>
<h2>1. Actors and access</h2>${tb(['Actor','Can do','Can see'],[['Event Organizer','Create, publish, share, manage tickets, orders, promoters, check-in','Own events only'],['Promoter','Share link or code, track referred sales, earn commission','Own link performance and own buyers'],['System Owner','Inspect all customer events, organizers, promoters, platform reports','All events, platform analytics'],['Buyer','Browse, buy as guest, receive ticket','Own tickets and orders']])}
<h2>2. Lifecycle</h2><p>Create → Publish → Share → Sell Tickets → Manage Orders → Track Sales → Manage Promoters → Check-in. The numbers stay the same across UI and docs.</p>
<h2>3. Creating an event (7 steps)</h2><ol><li><b>Basic Info:</b> name, category, short and full description, cover image, gallery.</li><li><b>Date & Venue:</b> start and end date and time, timezone, venue, address, city, map pin.</li><li><b>Tickets:</b> choose the event currency (any ISO currency such as USD, EUR, KES, TZS), then per ticket type: name, price, capacity, sales window, min and max per order.</li><li><b>Promoters:</b> promoter email, commission percent, promo code, tracked link.</li><li><b>Policies:</b> refunds, transfers, age limit, terms, instructions.</li><li><b>Review:</b> public preview and checklist with an Edit button per section.</li><li><b>Publish:</b> event goes live at its public URL.</li></ol>
<h2>4. Event control center</h2><p>Opening an event shows Overview, Tickets, Orders, Promoters, Analytics, Check-in and Reports. These tabs belong to the event, not the global menu.</p>
<h2>5. Buying a ticket</h2><ol><li>Buyer picks tickets on the public event page.</li><li>Guest details: name, email, phone. No account needed.</li><li><b>Email confirmation:</b> a 6-digit code is sent to the email; checkout continues only after it is entered.</li><li><b>Payment:</b> Stripe card (Visa, Mastercard, American Express) or M-Pesa STK push. Amounts use the event currency.</li><li>The order becomes Paid only when Stripe or M-Pesa confirms via webhook or callback.</li><li>The ticket with QR code is emailed and shown in the app.</li></ol>
<h2>6. Promoter tracking</h2><ul><li>Each promoter gets a tracked link (<code>?ref=code</code>) and a promo code.</li><li>Every click is logged. A purchase is attributed to a promoter by the link cookie or the promo code.</li><li>Promoters see clicks, visitors, checkouts started, buyers, tickets, revenue, commission, and each buyer's payment record.</li><li>The organizer sees every promoter's buyers, revenue and commission for that event. Promoters never see each other.</li></ul>
<h2>7. Payments and commission</h2><ul><li>Each payment is stored in a ledger: reference, method, gross, platform fee, promoter commission, host payout, status <code>pending</code>, <code>paid</code> or <code>refunded</code>.</li><li>Stripe Connect Express onboarding for hosts and promoters; one charge is split across platform, promoter and host.</li><li>Refunds set the ledger row to <code>refunded</code> and reverse the commission and payout.</li></ul>
<h2>8. Tickets and check-in</h2><p>Each ticket has a unique number and QR. Scanning returns Valid, Invalid, Already checked in, Cancelled or Refunded. Tickets cannot be shared from the app, so QR codes stay private.</p>
<h2>9. Analytics scope</h2>${tb(['Scope','Shows'],[['Organizer','One event: sales, revenue, ticket types, check-in, promoters'],['Promoter','Own link: clicks, buyers, payments, commission'],['System Owner','Platform totals and trends'],['Buyer','Own tickets and orders']])}
<h2>10. Data</h2><pre>events(id, owner_id, promoter_id, host_id, currency, status, ...)\nticket_types(event_id, name, price, capacity, sales_start, sales_end, min, max)\norders(event_id, buyer_email, email_verified, promoter_id, status)\nledger(order_id, method, ref, gross, platform_amt, promoter_amt, host_amt, status)\nlink_clicks(promoter_id, event_id, channel, ts)</pre>
<h2>11. Security</h2><p>Every endpoint checks ownership on the server. Client-supplied user or event IDs are never trusted. Exports and payments in this prototype are simulated.</p></div>`}

render();
</script></body></html>
